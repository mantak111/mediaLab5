<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title> CREATE WebRTC channel </title>
  <link href="noserv.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
</head>
<body>
<h2> CREATE WebRTC channel <span id="status"> init </span></h2>

<h3>Local Camera</h3>
<video id="local-video" autoplay muted playsinline></video>
<h3>Remote Camera</h3>
<canvas id="remote-video" style="width:100%;max-height:150px;background:#000;display:block;margin:3px 0"></canvas><button id="snap-btn" disabled>Capture Snapshot</button>
<canvas id="snap-canvas" style="display:none"></canvas>
<img id="snap-img" style="max-width:100%;display:none">

<h3> 1.CREATE Offer's SDP </h3>
<textarea id="creater-sdp"></textarea>
<h3> 4.GET Participant's SDP <button id="start">start</button></h3>
<textarea id="joiner-sdp" placeholder="HERE COPY AND PASTE [3.Participant'S SDP]"></textarea>
<h3> CHAT </h3>
<div id="chat">
  <div id="chat-screen-wp">
    <div id="chat-screen"></div>
  </div>
  <div id="ct"><input id="msg" disabled><button id="send" disabled>send</button></div>
</div>
<script>
var pc = new RTCPeerConnection(null);
var dc;
var localStream;

// Get camera and add tracks to peer connection
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  navigator.mediaDevices.getUserMedia({ video: true, audio: false })
    .then(function(stream) {
      localStream = stream;
      document.getElementById('local-video').srcObject = stream;
      stream.getTracks().forEach(function(track) {
        pc.addTrack(track, stream);
      });
      createOfferSDP();
    })
    .catch(function(err) {
      console.error('Camera error:', err);
      createOfferSDP();
    });
} else {
  console.warn('Camera not available (requires HTTPS or localhost)');
  createOfferSDP();
}


pc.oniceconnectionstatechange = function(e) {
  var state = pc.iceConnectionState;
  $('#status').html(state);
  if (state == "connected") {
    $("#msg, #send, #snap-btn").attr("disabled", false);
    if (!dc || dc.readyState !== 'open') {
      startCameraShare();
    }
  }
  if (state == "disconnected" || state == "failed" || state == "closed") {
    stopCameraShare();
  }
};
pc.onicecandidate = function(e) {
  if (e.candidate) return;
  $("#creater-sdp").val(JSON.stringify(pc.localDescription));
};

function createOfferSDP() {
  dc = pc.createDataChannel("chat");
  pc.createOffer().then(function(e) {
    pc.setLocalDescription(e);
  });
  dc.onopen = function() {
    $("textarea").attr("disabled", true);
    addMSG("CONNECTED!", "info");
    startCameraShare();
  };
  dc.onmessage = function(e) {
    try {
      var msg = JSON.parse(e.data);
      if (msg.type === 'camera-frame' && msg.data) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.getElementById('remote-video');
          canvas.width = img.width;
          canvas.height = img.height;
          canvas.getContext('2d').drawImage(img, 0, 0);
        };
        img.src = msg.data;
      } else if (e.data) {
        addMSG(e.data, "other");
      }
    } catch(err) {
      if (e.data) addMSG(e.data, "other");
    }
  };
}

function start() {
  var answerSDP = $('#joiner-sdp').val();
  var answerDesc = new RTCSessionDescription(JSON.parse(answerSDP));
  pc.setRemoteDescription(answerDesc);
}

// Function to capture local camera frame and send as base64
function sendCameraFrame() {
  if (!localStream) return;
  var video = document.getElementById('local-video');
  var canvas = document.getElementById('snap-canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  var dataURL = canvas.toDataURL('image/jpeg', 0.8);
  if (dc && dc.readyState === 'open') {
    dc.send(JSON.stringify({type: 'camera-frame', data: dataURL}));
  }
}

// Start sending camera frames periodically
var cameraInterval;
function startCameraShare() {
  if (cameraInterval) clearInterval(cameraInterval);
  cameraInterval = setInterval(sendCameraFrame, 100); // Send frame every 100ms
}

function stopCameraShare() {
  if (cameraInterval) clearInterval(cameraInterval);
}

// Snapshot: save current displayed frame
$('#snap-btn').click(function() {
  var canvas = document.getElementById('remote-video');
  var dataURL = canvas.toDataURL('image/png');
  $('#snap-img').attr('src', dataURL).show();
});

var addMSG = function(msg, who) {
  var wrap = $("<div>").addClass("wrap").appendTo($("#chat-screen"));
  var div  = $("<div>").addClass(who).appendTo(wrap);
  $("<span>").html(who).addClass("who").appendTo(div);
  $("<span>").html(msg).addClass("msg").appendTo(div);
  $("#chat-screen-wp").scrollTop($("#chat-screen").height());
};

var sendMSG = function() {
  var value = $("#msg").val();
  if (value) {
    dc.send(value);
    addMSG(value, "me");
    $("#msg").val('');
  }
};
$("#start").click(function() { start(); });
$("#msg").keypress(function(e) { if (e.which == 13) { sendMSG(); } });
$("#send").click(sendMSG);
</script>
</body>
</html>
